@if (member(); as member) {
  <div class="flex gap-6">
    <div class="card bg-base-200 flex flex-col h-[85vh] w-1/4">
      <img
        [src]="member.imageUrl || '/default-user.png'"
        alt="{{ member.displayName }}"
        class="rounded-full mx-10 mt-3 object-cover"
      />
      <div class="card-body">
        <div class="flex flex-col items-center">
          <div class="flex text-2xl text-primary">{{ member.displayName }}, {{ member.dateOfBirth | age }} </div>
          <div class="text-sm">{{ member.city }}, {{ member.country }}</div>
        </div>
        <div class="divider"></div>
        <ul class="menu rounded-box w-full text-xl">
          <li>
            <a routerLink="profile" routerLinkActive="text-primary"> View Profile </a>
            <a routerLink="photos" routerLinkActive="text-primary"> Photos </a>
            <a routerLink="messages" routerLinkActive="text-primary"> Messages </a>
          </li>
        </ul>
      </div>
      <div class="card-actions justify-between gap-3 px-2 mb-3">
        <button class="btn btn-info flex-1">Go back</button>
        <button class="btn btn-primary flex-1">Like</button>
      </div>
    </div>
    <div class="card bg-base-200 w-3/4 p-6">
      <div class="flex justify-between items-center">
        <h3 class="card-title text-3xl text-primary">{{ member.displayName }} {{ title() }}</h3>
        @if (isCurrentUser()) {
          <button (click)="memberService.editMode.set(!memberService.editMode())" class="btn btn-primary btn-outline">{{
            memberService.editMode() ? 'Cancel' : 'Edit Profile'
            }}</button>
        }
      </div>
      <div class="divider"></div>
      <router-outlet></router-outlet>
    </div>
  </div>
}
