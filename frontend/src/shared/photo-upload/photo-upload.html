<div class="flex w-full gap-6 min-h-100">
  <div class="flex items-center gap-4 w-2/3">
    <label
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      [class.border-blue-500]="isDraged()"
      [class.border-4]="isDraged()"
      [class.bg-blue-100]="isDraged()"
      for="photoInput"
      class="flex flex-col items-center justify-center w-full border-2 border-dashed border-gray-300 h-full rounded-lg cursor-pointer"
    >
      <p class="mb-2 text-lg">Click or drag a photo here</p>
      <input id="photoInput" type="file" class="hidden" />
    </label>
  </div>
  @if (imgSrc()) {
    <div class="flex flex-col gap-3 w-1/3">
      <div class="flex justify-center border-2 border-gray-300 rounded-lg">
        <img
          [src]="imgSrc() || 'default-user.png'"
          alt="image preview"
          class="aspect-square object-cover rounded-lg"
        />
      </div>
      <div class="flex w-full gap-3">
        <button type="button" (click)="onCancel()" class="btn flex-1">Cancel</button>
        <button type="button" (click)="onUpload()" [disabled]="loading()" class="btn btn-primary flex-1"
        >
        @if (loading()) {
          <span class="loading loading-spinner">Loading...</span>
        }
        Upload Photo</button>
      </div>
    </div>
  }
</div>
