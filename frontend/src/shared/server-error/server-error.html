<div class="card bg-base-100 w-4xl mx-auto flex flex-col items-center rounded-xl shadow-xl p-10">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="1.5"
    stroke="currentColor"
    class="size-32"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
    />
  </svg>

  <p class="mt-4 text-lg font-semibold">Server Error</p>
  <p class="mt-4 text-center text-sm text-gray-500">{{ error()?.message }}</p>
  <button class="mt-4 btn btn-primary" (click)="goBack()">Go Back</button>
  <button class="mt-2 btn btn-secondary" (click)="toggleDetails()">Toggle Details</button>
  @if(showDetails){
    <p class="mt-2 text-sm text-gray-500">{{ error()?.details }}</p>
  }
</div>
